name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  boundaries:
    name: Plugin boundaries (ADR-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/check-plugin-boundaries.sh

  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint

  analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer analyse

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test:unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wp: '6.4.5'
          - php: '8.2'
            wp: '7.1'
          - php: '8.4'
            wp: '7.1'
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mysqli
      - uses: ramsey/composer-install@v3
      - name: Install WordPress test library
        run: bash bin/install-wp-tests.sh ${{ matrix.wp }}
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
      - run: composer test:integration

  activation:
    name: Each plugin activates alone
    runs-on: ubuntu-latest
    needs: [ unit ]
    strategy:
      fail-fast: false
      matrix:
        plugin: [ odsi-lms, odsi-social, odsi-bridge ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start WordPress with only ${{ matrix.plugin }}
        run: |
          cat > .wp-env.override.json <<JSON
          { "plugins": [ "./plugins/${{ matrix.plugin }}" ] }
          JSON
          npx wp-env start
      - name: Assert clean activation with WP_DEBUG
        run: |
          set -euo pipefail
          # The bridge needs both other plugins; alone it must deactivate itself with a notice, not fatal.
          npx wp-env run tests-cli wp plugin list --format=csv
          npx wp-env run tests-cli wp eval 'echo "boot ok\n";' 2>&1 | tee /tmp/boot.log
          if grep -qiE "notice|warning|deprecated|fatal" /tmp/boot.log; then
            echo "PHP notices emitted during boot"; exit 1
          fi
          curl -sSf -o /dev/null http://localhost:8889/
      - run: npx wp-env stop

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [ unit, integration ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - name: Permalinks and E2E flag
        run: |
          npx wp-env run tests-cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run tests-cli wp config set ODSI_E2E true --raw
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: .playwright/results
      - run: npx wp-env stop
